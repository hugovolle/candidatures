<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #f6f4ef; --carte: #ffffff; --encre: #161514; --doux: #6f6b64; --trait: #e4e0d8;
    --ok: #1f6f43; --ok-fond: #e6f2ea; --non: #9b2c1f; --non-fond: #f7e7e4; --info: #2c4a9b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #141312; --carte: #1d1c1a; --encre: #f1eee8; --doux: #a19c93; --trait: #2f2d2a;
      --ok: #7fd1a0; --ok-fond: #1b2b21; --non: #f0a294; --non-fond: #2e1c19; --info: #9fb4f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 15px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font: 400 40px/1.05 'Instrument Serif', serif; margin: 0 0 4px; }
  h2 { font: 400 26px/1.1 'Instrument Serif', serif; margin: 36px 0 12px; }
  .sous { color: var(--doux); margin: 0 0 20px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--trait); }
  .badge.sim { background: #fff0c2; color: #6b4e00; }
  .alerte { background: var(--non-fond); color: var(--non); padding: 12px 14px; border-radius: 10px; margin: 12px 0; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 18px; margin: 14px 0; }
  .tete { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .entreprise { font: 400 24px/1.1 'Instrument Serif', serif; }
  .meta { color: var(--doux); font-size: 13px; }
  .signal { margin: 10px 0 0; } .signal b { font-weight: 600; }
  .sources a { color: var(--info); font-size: 13px; margin-right: 10px; word-break: break-all; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--doux); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--encre); background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; padding: 10px; }
  textarea { min-height: 360px; resize: vertical; }
  textarea.court { min-height: 90px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { font: 600 14px Inter, sans-serif; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; }
  .valider { background: var(--ok); color: #fff; } .rejeter { background: var(--non-fond); color: var(--non); }
  .neutre { background: var(--trait); color: var(--encre); }
  .tout { width: 100%; background: var(--encre); color: var(--fond); margin: 8px 0 4px; }
  .erreurs { color: var(--non); font-size: 13px; margin-top: 8px; white-space: pre-line; }
  .vide { color: var(--doux); font-style: italic; }
  .ligne { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--trait); font-size: 14px; }
  details summary { cursor: pointer; color: var(--doux); }
  .copie { white-space: pre-wrap; background: var(--fond); border-radius: 8px; padding: 10px; font-size: 14px; }
  #chargement { color: var(--doux); }
</style>
</head>
<body>
<main>
  <h1>Lot du jour</h1>
  <p class="sous" id="date"></p>
  <div id="contenu"><p id="chargement">Chargement…</p></div>
</main>

<script>
const MOTIFS = ['Pas le bon poste', 'Entreprise peu intéressante', 'Mauvais interlocuteur', 'Ton à revoir', 'Risque de fuite (Camden)', 'Déjà en contact', 'Autre'];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('date').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

function appel(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}

function rendre(d) {
  const c = document.getElementById('contenu');
  let h = '';
  h += '<p>' + (d.mode === 'reel' ? '<span class="badge">Envoi réel</span>' : '<span class="badge sim">Simulation : rien ne part</span>') + '</p>';
  if (!d.portfolioConfigure) h += '<div class="alerte">Le lien du portfolio n\'est pas configuré : aucun email ne partira tant qu\'il manque.</div>';

  h += '<h2>À valider (' + d.aValider.length + ')</h2>';
  if (!d.aValider.length) h += '<p class="vide">Rien à valider pour l\'instant.</p>';
  else h += '<button class="tout" onclick="toutValider()">Tout valider (' + d.aValider.length + ')</button>';
  for (const a of d.aValider) h += carte(a);

  h += '<h2>LinkedIn, à faire à la main (' + d.linkedin.length + ')</h2>';
  if (!d.linkedin.length) h += '<p class="vide">Aucune action LinkedIn en attente.</p>';
  for (const a of d.linkedin) h += carteLinkedin(a);

  h += '<h2>Validées, en file d\'envoi (' + d.planifiees.length + ')</h2>';
  if (!d.planifiees.length) h += '<p class="vide">File vide.</p>';
  for (const a of d.planifiees) h += '<div class="ligne"><span>' + esc(a.entreprise) + ' · ' + esc(a.personne) + '</span><span class="meta">' + (a.envoi_prevu ? 'prévu à ' + esc(a.envoi_prevu) : 'à planifier') + '</span></div>';

  if (d.bloquees.length) {
    h += '<h2>Bloquées par les garde-fous (' + d.bloquees.length + ')</h2>';
    for (const a of d.bloquees) h += '<details class="carte"><summary>' + esc(a.entreprise) + '</summary><div class="erreurs">' + esc(String(a.erreurs).split(' ; ').join('\n')) + '</div></details>';
  }
  c.innerHTML = h;
}

function carte(a) {
  return '<div class="carte" id="c-' + esc(a.id) + '">' +
    '<div class="tete"><span class="entreprise">' + esc(a.entreprise) + '</span><span class="badge">' + esc(a.priorite) + ' · ' + esc(a.intitule) + ' · ' + esc(a.score) + '/100</span></div>' +
    '<div class="meta">' + esc(a.personne) + ', ' + esc(a.poste_personne) + ' · ' + esc(a.email || 'LinkedIn seulement') + '</div>' +
    '<p class="signal"><b>Signal.</b> ' + esc(a.signal) + '</p>' +
    '<p class="signal"><b>Leur problème.</b> ' + esc(a.probleme) + '</p>' +
    '<div class="sources">' + a.sources.map((s) => '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s.replace(/^https?:\/\//, '').slice(0, 50)) + '</a>').join('') + '</div>' +
    (a.email ? '<label>Objet</label><input id="o-' + esc(a.id) + '" value="' + esc(a.objet) + '">' +
      '<label>Email</label><textarea id="m-' + esc(a.id) + '">' + esc(a.corps) + '</textarea>' +
      (a.relance ? '<label>Relance (J+6 ouvrés si pas de réponse)</label><textarea class="court" id="r-' + esc(a.id) + '">' + esc(a.relance) + '</textarea>' : '') : '') +
    (a.remarques ? '<p class="meta">Censeur : ' + esc(a.remarques) + '</p>' : '') +
    '<div class="erreurs" id="e-' + esc(a.id) + '"></div>' +
    '<div class="actions">' +
      '<button class="valider" onclick="valider(\'' + esc(a.id) + '\')">Valider</button>' +
      (a.email ? '<button class="neutre" onclick="enregistrer(\'' + esc(a.id) + '\')">Enregistrer mes modifications</button>' : '') +
      '<select id="mo-' + esc(a.id) + '" style="width:auto">' + MOTIFS.map((m) => '<option>' + m + '</option>').join('') + '</select>' +
      '<button class="rejeter" onclick="rejeter(\'' + esc(a.id) + '\')">Rejeter</button>' +
    '</div></div>';
}

function carteLinkedin(a) {
  const invitation = a.linkedin_statut === 'invitation';
  return '<div class="carte"><div class="tete"><span class="entreprise">' + esc(a.personne) + '</span><span class="meta">' + esc(a.entreprise) + '</span></div>' +
    '<p><a href="' + esc(a.linkedin_url) + '" target="_blank" rel="noopener">Ouvrir le profil LinkedIn</a></p>' +
    (!invitation ? '<p class="meta">1. Envoie l\'invitation ' + (a.linkedin_note ? 'avec cette note :' : 'sans note.') + '</p>' +
      (a.linkedin_note ? '<div class="copie">' + esc(a.linkedin_note) + '</div>' : '') +
      '<div class="actions"><button class="neutre" onclick="li(\'' + esc(a.id) + '\',\'invitation\')">Invitation envoyée</button></div>'
    : '<p class="meta">2. Une fois l\'invitation acceptée, envoie ce message :</p><div class="copie">' + esc(a.linkedin_message) + '</div>' +
      '<div class="actions"><button class="neutre" onclick="copier(this)">Copier</button><button class="valider" onclick="li(\'' + esc(a.id) + '\',\'message\')">Message envoyé</button></div>') +
    '</div>';
}

async function action(p, idErreur) {
  try {
    const d = await p;
    if (d && d.erreurs) { document.getElementById(idErreur).textContent = 'Garde-fous :\n' + d.erreurs.join('\n'); return; }
    rendre(d);
  } catch (e) { alert('Erreur : ' + (e.message || e)); }
}
const valider = (id) => action(appel('valider', id));
const toutValider = () => { if (confirm('Valider toutes les approches de la liste ?')) action(appel('toutValider')); };
const rejeter = (id) => action(appel('rejeter', id, document.getElementById('mo-' + id).value));
const li = (id, etape) => action(appel('linkedinFait', id, etape));
function enregistrer(id) {
  const champs = { objet: document.getElementById('o-' + id).value, corps: document.getElementById('m-' + id).value };
  const r = document.getElementById('r-' + id); if (r) champs.relance = r.value;
  action(appel('modifier', id, champs), 'e-' + id);
}
function copier(b) { navigator.clipboard.writeText(b.closest('.carte').querySelector('.copie').textContent); b.textContent = 'Copié'; }

appel('donneesPage').then(rendre).catch((e) => { document.getElementById('contenu').innerHTML = '<div class="alerte">' + esc(e.message || e) + '</div>'; });
</script>
</body>
</html>
